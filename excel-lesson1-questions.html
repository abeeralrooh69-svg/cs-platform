<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بنك الأسئلة: مقدمة Excel وقائمة File</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#0a1128;--sf:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--tx:#fff;--mu:#a0aec0;--cy:#00f2fe;--ok:#34d399;--no:#fb7185;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,system-ui,sans-serif;color:var(--tx);line-height:1.75;min-height:100vh;background:radial-gradient(55% 35% at 85% -5%,rgba(79,172,254,.28),transparent 70%),radial-gradient(45% 30% at 0% 15%,rgba(0,242,254,.12),transparent 70%),var(--bg)}
.wrap{max-width:720px;margin:auto;padding:16px 14px 60px}
.top{text-align:center;padding:10px 0 4px}.top h1{font-size:clamp(1.25rem,5vw,1.8rem);font-weight:800;margin:0 0 2px}.top p{margin:0;color:var(--mu);font-size:.9rem}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:.85rem;margin:16px 0 8px;gap:8px;flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4facfe,#00f2fe);transition:width .35s}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:22px;padding:20px;margin-top:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;color:var(--cy);background:rgba(0,242,254,.1);border:1px solid rgba(0,242,254,.25);border-radius:99px;padding:1px 12px}
.en{font-family:system-ui,sans-serif;font-size:.94em;color:#cdeaff;unicode-bidi:isolate}
.btn{font:inherit;font-weight:700;font-size:.92rem;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:9px 18px;cursor:pointer;transition:.2s}
.btn:hover{border-color:var(--cy);color:var(--cy)}.btn.p{background:linear-gradient(135deg,#4facfe,#00f2fe);border-color:transparent;color:#06142e}.btn.p:hover{box-shadow:0 0 22px rgba(0,242,254,.5);color:#06142e}
.btn.ok{background:rgba(52,211,153,.15);border-color:rgba(52,211,153,.5);color:var(--ok)}.btn.rv{background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.45);color:var(--no)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.row .btn{flex:1;min-width:110px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.qt{font-size:1.12rem;font-weight:700;margin:12px 0 14px;line-height:1.8}
.opt{display:block;width:100%;text-align:start;font:inherit;color:var(--tx);background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin:9px 0;cursor:pointer;transition:.2s}
.opt:hover:not(:disabled){border-color:var(--cy);background:rgba(0,242,254,.07)}.opt:disabled{cursor:default}
.opt.ok{background:rgba(52,211,153,.16);border-color:var(--ok);color:#b9f6dc}.opt.no{background:rgba(251,113,133,.15);border-color:var(--no);color:#ffd0d7}
.exp{margin:14px 0;padding:12px 16px;border-radius:14px;font-size:.95rem}.exp.g{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.35)}.exp.b{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.35)}
.res{text-align:center}.ring{--p:0;width:150px;height:150px;border-radius:50%;margin:10px auto 16px;display:grid;place-items:center;background:conic-gradient(#00f2fe calc(var(--p)*1%),rgba(255,255,255,.1) 0)}
.ring b{width:122px;height:122px;border-radius:50%;background:#0d1836;display:grid;place-items:center;font-size:2.1rem}
.rev{text-align:start;margin-top:16px}.rev .it{border-top:1px solid var(--bd);padding:12px 0}.rev small{color:var(--mu)}.rev .a{color:var(--ok)}
</style></head><body><div class="wrap"><div class="top"><h1>بنك الأسئلة: مقدمة Excel وقائمة File</h1><p>الوحدة 2 · الدرس الأول · تغذية راجعة فورية</p></div><div class="meta"><span id="pg"></span><span id="sc"></span></div><div class="bar"><i id="bar"></i></div><div id="box"></div></div><script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RE=/([A-Za-z0-9][A-Za-z0-9 +&'’.,:\/_\-]*[A-Za-z0-9]|[A-Za-z])/g;
const en=s=>String(s).split(RE).map((p,i)=>i%2?`<bdi dir="ltr" class="en">${esc(p)}</bdi>`:esc(p)).join('');
const sh=a=>{for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const Q=[{"t": "mc", "q": "برنامج Microsoft Excel هو برنامج:", "o": ["معالجة نصوص", "جداول إلكترونية", "عروض تقديمية", "قواعد بيانات فقط"], "a": 1, "e": "Excel برنامج جداول إلكترونية (Spreadsheet) لإدخال البيانات وإجراء العمليات الحسابية وتحليلها."}, {"t": "mc", "q": "الامتداد الافتراضي لملف Excel الحديث هو:", "o": [".docx", ".xlsx", ".pptx", ".csv"], "a": 1, "e": "الامتداد الافتراضي لمصنفات Excel هو xlsx."}, {"t": "mc", "q": "الملف الكامل الذي يحتوي على ورقة عمل أو أكثر يسمى:", "o": ["الخلية", "النطاق", "المصنف (Workbook)", "الشريط"], "a": 2, "e": "المصنف (Workbook) هو ملف Excel ويحتوي ورقة عمل أو أكثر."}, {"t": "mc", "q": "عنوان الخلية الواقعة عند تقاطع العمود C والصف 5 هو:", "o": ["5C", "C5", "C:5", "CR5"], "a": 1, "e": "يُكتب عنوان الخلية بحرف العمود ثم رقم الصف: C5."}, {"t": "mc", "q": "النطاق A1:C5 يعني الخلايا:", "o": ["A1 وC5 فقط", "من A1 إلى C5", "العمود A فقط", "الصف 5 فقط"], "a": 1, "e": "النطاق مجموعة خلايا متجاورة من A1 إلى C5."}, {"t": "mc", "q": "عدد الصفوف في ورقة العمل الواحدة:", "o": ["65,536", "1,048,576", "16,384", "10,000"], "a": 1, "e": "ورقة العمل فيها 1,048,576 صفاً و16,384 عموداً (حتى العمود XFD)."}, {"t": "mc", "q": "آخر عمود في ورقة العمل هو:", "o": ["Z", "ZZ", "XFD", "AAA"], "a": 2, "e": "عدد الأعمدة 16,384 وآخرها XFD."}, {"t": "mc", "q": "المربع الذي يعرض عنوان الخلية النشطة يسمى:", "o": ["Formula Bar", "Name Box", "Status Bar", "Title Bar"], "a": 1, "e": "مربع الاسم (Name Box) يعرض عنوان الخلية النشطة."}, {"t": "mc", "q": "الشريط الذي يعرض محتوى الخلية أو صيغتها ويُستخدم للتعديل هو:", "o": ["شريط الصيغة (Formula Bar)", "شريط الحالة", "شريط العنوان", "شريط التمرير"], "a": 0, "e": "شريط الصيغة يعرض محتوى الخلية وفيه الزر fx لإدراج دالة."}, {"t": "mc", "q": "الأوامر السريعة مثل Save وUndo وRedo توجد في:", "o": ["شريط الحالة", "شريط الوصول السريع (Quick Access Toolbar)", "تبويبات الأوراق", "مربع الاسم"], "a": 1, "e": "شريط الوصول السريع يحتوي أوامر سريعة ويمكن تخصيصه."}, {"t": "mc", "q": "الشريط (Ribbon) يتكون من:", "o": ["علامات تبويب وأوامر مجمعة في مجموعات", "أوراق عمل فقط", "خلايا فقط", "قوائم الطباعة"], "a": 0, "e": "الشريط يضم علامات تبويب (Tabs) وأوامر مجمعة في مجموعات (Groups)."}, {"t": "mc", "q": "الجزء الذي يعرض إحصاءات سريعة للخلايا المحددة مثل Sum وAverage هو:", "o": ["Title Bar", "Name Box", "Status Bar", "Ribbon"], "a": 2, "e": "شريط الحالة يعرض حالة البرنامج وإحصاءات سريعة وأزرار العرض وشريط التكبير."}, {"t": "mc", "q": "عند الضغط على تبويب File يظهر:", "o": ["عرض الكواليس (Backstage View)", "جدول بيانات جديد", "قائمة الدوال فقط", "شريط الصيغة"], "a": 0, "e": "تبويب File يفتح واجهة كاملة (Backstage) لإدارة الملف."}, {"t": "mc", "q": "اختصار حفظ المصنف هو:", "o": ["Ctrl+P", "Ctrl+S", "Ctrl+N", "Ctrl+W"], "a": 1, "e": "Ctrl+S للحفظ."}, {"t": "mc", "q": "اختصار الأمر Save As هو:", "o": ["F12", "F5", "F2", "F1"], "a": 0, "e": "F12 يفتح نافذة حفظ باسم."}, {"t": "mc", "q": "اختصار إنشاء مصنف جديد:", "o": ["Ctrl+O", "Ctrl+N", "Ctrl+S", "Ctrl+W"], "a": 1, "e": "Ctrl+N ينشئ مصنفاً جديداً."}, {"t": "mc", "q": "اختصار الطباعة هو:", "o": ["Ctrl+P", "Ctrl+F", "Ctrl+B", "Ctrl+Z"], "a": 0, "e": "Ctrl+P يفتح صفحة الطباعة في قائمة File."}, {"t": "mc", "q": "لإغلاق المصنف الحالي دون الخروج من برنامج Excel نستخدم:", "o": ["Close (Ctrl+W)", "Alt+F4", "Share", "Export"], "a": 0, "e": "الأمر Close يغلق المصنف فقط، أما Alt+F4 فيغلق البرنامج."}, {"t": "mc", "q": "لحفظ المصنف كملف PDF نستخدم:", "o": ["Save As أو Export", "Account", "Feedback", "Options فقط"], "a": 0, "e": "من File يمكن اختيار Export أو Save As وتحديد صيغة PDF."}, {"t": "mc", "q": "لتشفير المصنف بكلمة مرور نذهب إلى:", "o": ["File ثم Info ثم Protect Workbook ثم Encrypt with Password", "Home ثم Format", "View ثم Zoom", "Insert ثم Chart"], "a": 0, "e": "الحماية بكلمة مرور تكون من File ثم Info ثم Protect Workbook."}, {"t": "mc", "q": "إعداد الحفظ التلقائي للاسترداد (AutoRecover) يوجد في:", "o": ["Options ثم Save", "Print", "Account", "Feedback"], "a": 0, "e": "من File ثم Options ثم Save، وهو افتراضياً كل 10 دقائق."}, {"t": "mc", "q": "الصيغة التي تحفظ المصنف مع الماكرو (Macro) هي:", "o": ["xlsx", "xlsm", "csv", "pdf"], "a": 1, "e": "xlsm هي صيغة مصنف Excel المفعّل بالماكرو."}, {"t": "mc", "q": "الصيغة المناسبة لتبادل البيانات كنص مفصول بفواصل هي:", "o": ["xltx", "csv", "xls", "docx"], "a": 1, "e": "csv نص مفصول بفواصل (Comma delimited)."}, {"t": "mc", "q": "الصيغة xltx تُستخدم لحفظ المصنف كـ:", "o": ["قالب (Template)", "ملف نصي", "صورة", "ملف صوتي"], "a": 0, "e": "xltx هي صيغة قالب Excel."}, {"t": "mc", "q": "لتغيير اتجاه الورقة الافتراضي إلى يمين-يسار (Right-to-left) نستخدم:", "o": ["Options ثم Advanced", "Print", "Share", "Info"], "a": 0, "e": "من File ثم Options ثم Advanced نختار الاتجاه الافتراضي (Default direction)."}, {"t": "mc", "q": "خيار Orientation في صفحة الطباعة يحدد:", "o": ["اتجاه الورقة: طولي أو عرضي", "نوع الخط", "لون الخلايا", "عدد الأوراق في المصنف"], "a": 0, "e": "Orientation يحدد Portrait أو Landscape."}, {"t": "tf", "q": "الأمر Save As يُستخدم لحفظ المصنف باسم أو مكان أو صيغة مختلفة.", "o": ["صح", "خطأ"], "a": 0, "e": "أما Save فيحفظ التعديلات بنفس الاسم والمكان."}, {"t": "tf", "q": "يمكن استخدام الرموز \\ / : * ? \" < > | في اسم الملف.", "o": ["صح", "خطأ"], "a": 1, "e": "هذه الأحرف ممنوعة في أسماء الملفات."}, {"t": "tf", "q": "عند الضغط على File يبقى الشريط الكامل (Ribbon) ظاهراً أمامك للتحرير.", "o": ["صح", "خطأ"], "a": 1, "e": "تفتح واجهة Backstage الكاملة، وللعودة إلى الورقة اضغط Esc أو سهم الرجوع."}, {"t": "tf", "q": "قد تختلف أسماء وترتيب بعض أوامر قائمة File بين إصدارات Excel.", "o": ["صح", "خطأ"], "a": 0, "e": "مثل Home وSave a Copy وPublish حسب الإصدار."}, {"t": "tf", "q": "الخيار Share في قائمة File يتيح دعوة آخرين أو إرسال نسخة بالبريد.", "o": ["صح", "خطأ"], "a": 0, "e": "مشاركة المصنف عبر OneDrive أو البريد."}, {"t": "tf", "q": "تُسمى الخلية المحاطة بإطار سميك الخلية النشطة (Active Cell).", "o": ["صح", "خطأ"], "a": 0, "e": "هي الخلية التي تُدخل فيها البيانات حالياً."}, {"t": "tf", "q": "الاختصار Alt+F4 يغلق المصنف فقط ويبقي Excel مفتوحاً.", "o": ["صح", "خطأ"], "a": 1, "e": "Alt+F4 يغلق برنامج Excel نفسه؛ لإغلاق المصنف فقط استخدم Ctrl+W."}];
let order=[],i=0,score=0,wrong=[];const box=$('#box');
function start(){order=sh(Q.map((_,k)=>k));i=0;score=0;wrong=[];draw()}
function draw(){if(i>=order.length)return fin();const q=Q[order[i]];let o=q.o.map((x,k)=>({x,k}));if(q.t==='mc')sh(o);
 $('#bar').style.width=(i/order.length*100)+'%';$('#pg').textContent=`سؤال ${i+1} من ${order.length}`;$('#sc').textContent=`الدرجة: ${score}`;
 box.innerHTML=`<div class="card"><span class="tag">${q.t==='tf'?'صح أو خطأ':'اختيار من متعدد'}</span><div class="qt">${en(q.q)}</div>${o.map(x=>`<button class="opt" data-k="${x.k}">${en(x.x)}</button>`).join('')}<div id="fb"></div></div>`;
 box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b,q))}
function pick(b,q){const ok=+b.dataset.k===q.a;box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add('ok')});
 if(ok)score++;else{b.classList.add('no');wrong.push(q)}$('#sc').textContent=`الدرجة: ${score}`;
 $('#fb').innerHTML=`<div class="exp ${ok?'g':'b'}"><b>${ok?'✅ إجابة صحيحة':'❌ إجابة خاطئة'}</b><div>${en(q.e)}</div></div><button class="btn p" style="width:100%" id="nx">${i+1>=order.length?'عرض النتيجة':'السؤال التالي ←'}</button>`;
 $('#nx').onclick=()=>{i++;draw();scrollTo(0,0)}}
function fin(){const n=order.length,p=Math.round(score/n*100);$('#bar').style.width='100%';$('#pg').textContent='انتهى الاختبار';
 const m=p>=90?'ممتاز! إتقان رائع للوحدة 🌟':p>=75?'جيد جداً، استمر 👏':p>=50?'جيد، راجع الأخطاء وأعد المحاولة 💪':'تحتاج إلى مراجعة الدرس ثم أعد المحاولة 📘';
 box.innerHTML=`<div class="card res"><span class="tag">النتيجة النهائية</span><div class="ring" style="--p:${p}"><b>${p}%</b></div><h2 style="margin:0 0 4px">${score} من ${n}</h2><p style="color:var(--mu);margin:0 0 14px">${m}</p><div class="row"><button class="btn p" id="again">إعادة الاختبار</button>${wrong.length?'<button class="btn" id="rvw">مراجعة الأخطاء ('+wrong.length+')</button>':''}</div><div id="rvbox"></div></div>`;
 $('#again').onclick=()=>{start();scrollTo(0,0)};const r=$('#rvw');if(r)r.onclick=()=>{$('#rvbox').innerHTML='<div class="rev">'+wrong.map(q=>`<div class="it"><b>${en(q.q)}</b><br><span class="a">الصحيح: ${en(q.o[q.a])}</span><br><small>${en(q.e)}</small></div>`).join('')+'</div>';r.style.display='none'}}
start();
</script></body></html>
