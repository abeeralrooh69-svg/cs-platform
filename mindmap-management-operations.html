function node(n,lv,idx){const has=n.c&&n.c.length,el=document.createElement('div');el.className='n'+(has?' has':'')+(lv===0?' br':'');el.dataset.lv=lv;el._d=n;
 el.innerHTML=`<div class="nl">${lv===0?`<span class="bn">${idx+1}</span>`:''}${has?'<span class="tg"></span>':'<span class="dt"></span>'}<span class="tx">${en(n.t)}</span>${has?`<span class="cnt">${n.c.length}</span>`:''}</div>`;
 if(has){const col=document.createElement('div'),inn=document.createElement('div'),kids=document.createElement('div');col.className='col';kids.className='kids';
  n.c.forEach(k=>kids.appendChild(node(k,lv+1)));inn.appendChild(kids);col.appendChild(inn);el.appendChild(col);
  if(lv<1)el.classList.add('open');el.firstChild.onclick=()=>el.classList.toggle('open')}
 return el}

D.forEach((b,i)=>{const e=node(b,0,i);e.style.setProperty('--c',COL[i%COL.length]);root.appendChild(e)});

document.getElementById('ea').onclick=()=>all().forEach(e=>e.classList.add('open'));

function filt(el,q,force){const d=el._d,self=d.t.toLowerCase().includes(q),f=force||(!!q&&self);let any=false;
 el.querySelectorAll(':scope>.col>div>.kids>.n').forEach(k=>{if(filt(k,q,f))any=true});
 const show=!q||self||force||any;el.hidden=!show;el.classList.toggle('hit',!!q&&self);if(q&&any)el.classList.add('open');return show}
document.getElementById('q').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();let n=0;
 if(!q)all().forEach(x=>x.classList.toggle('open',x.dataset.lv==='0'));
 [...root.children].forEach(b=>{if(filt(b,q,false))n++});document.getElementById('none').style.display=n?'none':'block'});
