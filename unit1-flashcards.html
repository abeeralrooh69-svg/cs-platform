<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مراجعة المصطلحات بالبطاقات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#0a1128;--sf:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--tx:#fff;--mu:#a0aec0;--cy:#00f2fe;--ok:#34d399;--no:#fb7185;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,system-ui,sans-serif;color:var(--tx);line-height:1.75;min-height:100vh;background:radial-gradient(55% 35% at 85% -5%,rgba(79,172,254,.28),transparent 70%),radial-gradient(45% 30% at 0% 15%,rgba(0,242,254,.12),transparent 70%),var(--bg)}
.wrap{max-width:720px;margin:auto;padding:16px 14px 60px}
.top{text-align:center;padding:10px 0 4px}.top h1{font-size:clamp(1.25rem,5vw,1.8rem);font-weight:800;margin:0 0 2px}.top p{margin:0;color:var(--mu);font-size:.9rem}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:.85rem;margin:16px 0 8px;gap:8px;flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4facfe,#00f2fe);transition:width .35s}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:22px;padding:20px;margin-top:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;color:var(--cy);background:rgba(0,242,254,.1);border:1px solid rgba(0,242,254,.25);border-radius:99px;padding:1px 12px}
.en{font-family:system-ui,sans-serif;font-size:.94em;color:#cdeaff;unicode-bidi:isolate}
.btn{font:inherit;font-weight:700;font-size:.92rem;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:9px 18px;cursor:pointer;transition:.2s}
.btn:hover{border-color:var(--cy);color:var(--cy)}.btn.p{background:linear-gradient(135deg,#4facfe,#00f2fe);border-color:transparent;color:#06142e}.btn.p:hover{box-shadow:0 0 22px rgba(0,242,254,.5);color:#06142e}
.btn.ok{background:rgba(52,211,153,.15);border-color:rgba(52,211,153,.5);color:var(--ok)}.btn.rv{background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.45);color:var(--no)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.row .btn{flex:1;min-width:110px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.scene{perspective:1100px;height:300px;margin-top:14px;cursor:pointer}.flip{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;border:1px solid var(--bd);overflow:auto}
.front{background:linear-gradient(135deg,rgba(79,172,254,.28),rgba(0,242,254,.08)),#0d1836;box-shadow:0 0 50px -12px rgba(0,242,254,.4)}
.front h2{font-size:clamp(1.5rem,6vw,2.1rem);margin:10px 0;font-weight:800}.front p{color:var(--mu);font-size:.85rem;margin:6px 0 0}
.back{transform:rotateY(180deg);background:#0d1836;font-size:1.05rem;line-height:1.9;justify-content:center}
.cnt{display:flex;justify-content:space-between;color:var(--mu);font-size:.85rem;margin:14px 0 8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tools .btn{flex:1;font-size:.82rem;padding:7px 10px}
.btn.on{border-color:var(--cy);color:var(--cy)}.done{text-align:center}
</style></head><body><div class="wrap"><div class="top"><h1>مراجعة المصطلحات بالبطاقات</h1><p>الإدارة والتشغيل · اقلب البطاقة وتحقق من حفظك</p></div><div class="cnt"><span id="pg"></span><span id="kn"></span></div><div class="bar"><i id="bar"></i></div><div id="box"></div><div class="tools"><button class="btn" id="sh">🔀 خلط</button><button class="btn" id="ov">المراجعة فقط</button><button class="btn" id="rst">إعادة الضبط</button></div></div><script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RE=/([A-Za-z0-9][A-Za-z0-9 +&'’.,:\/_\-]*[A-Za-z0-9]|[A-Za-z])/g;
const en=s=>String(s).split(RE).map((p,i)=>i%2?`<bdi dir="ltr" class="en">${esc(p)}</bdi>`:esc(p)).join('');
const sh=a=>{for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const C=[{"f": "الحاسوب", "g": "مقدمة", "b": "جهاز كهربائي إلكتروني له قدرة فائقة على استقبال (إدخال) البيانات ومعالجتها وتخزينها وإخراجها."}, {"f": "عناصر الحاسوب الثلاثة", "g": "مقدمة", "b": "المكونات المادية (Hardware)، والمكونات البرمجية (Software)، ومستخدم الحاسوب (User)."}, {"f": "Hardware", "g": "مكونات", "b": "المكونات المادية: مجموعة الأجزاء الملموسة في الجهاز."}, {"f": "Software", "g": "مكونات", "b": "المكونات البرمجية، وتنقسم إلى برامج تشغيل وبرامج تطبيق."}, {"f": "الحاسب الشخصي PC", "g": "التصنيف", "b": "الحاسب الدقيق (المكتبي) Microcomputer: أصغر أنواع الحاسبات ذات الأغراض العامة، ويعتمد على المعالج الدقيق."}, {"f": "Microprocessor", "g": "التصنيف", "b": "المعالج الدقيق: الذي تعتمد عليه الحاسبات الدقيقة (المكتبية)."}, {"f": "حاسبات الأغراض العامة", "g": "التصنيف", "b": "General Purpose: تُستخدم في الأغراض العلمية والتجارية والإدارية (البنوك والرواتب والميزانيات والمعادلات والتصاميم الهندسية)، وتتميز بالمرونة الكاملة."}, {"f": "حاسبات الأغراض الخاصة", "g": "التصنيف", "b": "Special Purpose: تُستخدم لغرض واحد فقط صُمم من أجله، مثل التحكم في العمليات وأجهزة الإنذار المبكر والمركبات الفضائية والأجهزة الطبية."}, {"f": "الحاسبات التناظرية", "g": "التصنيف", "b": "Analog Computer: تعالج البيانات المتغيرة باستمرار مثل درجات الحرارة والضغط الجوي، وتُستخدم في المشكلات العلمية والهندسية وتصميم نماذج الطائرات والصواريخ."}, {"f": "الحاسبات الرقمية", "g": "التصنيف", "b": "Digital Computer: تستعمل المعلومات المتقطعة والمتغيرات الممثلة بالأعداد، وهي من أكثر الحاسبات مرونة في تنفيذ العمليات."}, {"f": "الحاسبات الهجينة", "g": "التصنيف", "b": "Hybrid Computer: مزيج من الرقمي والتناظري، مداخلها ومخارجها تناظرية والمعالجة رقمية، تجمع دقة وتخزين الرقمي مع سرعة استجابة التناظري."}, {"f": "الحاسبات الصغيرة (Minicomputers)", "g": "التصنيف", "b": "ظهرت في مطلع الستينيات كأجهزة متخصصة، ثم صارت للاستخدامات العامة، وذُكر في الملف أنها (اللاب توب)."}, {"f": "الأجهزة الطرفية", "g": "Hardware", "b": "Peripheral Devices: مكونات ترتبط خارجياً بالحاسوب عبر المنافذ (Ports) الموجودة خلف صندوق النظام."}, {"f": "Ports (المنافذ)", "g": "Hardware", "b": "فتحات خلف صندوق النظام تُربط بها الأجهزة الطرفية."}, {"f": "وحدات الإدخال", "g": "Hardware", "b": "Input Units: يتم من خلالها إدخال البيانات للحاسوب: الكاميرا، الميكروفون، الماسح الضوئي، لوحة المفاتيح، الفأرة."}, {"f": "وحدات الإخراج", "g": "Hardware", "b": "Output Units: مهمتها إخراج البيانات من الحاسوب: الطابعة، السماعة، الشاشة."}, {"f": "CPU", "g": "المعالجة", "b": "وحدة المعالجة المركزية: أهم أجزاء الحاسوب، تعالج البيانات وتنسق العمل بين أجزائه، وتتكون من ALU ووحدة التحكم والذاكرة الرئيسية."}, {"f": "ALU", "g": "المعالجة", "b": "وحدة الحساب والمنطق: مسؤولة عن العمليات الحسابية (الجمع والطرح والقسمة) والمنطقية (كالمقارنة بين عددين)."}, {"f": "Control Unit", "g": "المعالجة", "b": "وحدة التحكم: تراقب تنفيذ الأعمال وتسهل الإدخال والإخراج وخزن البيانات وتنسيقها، وتوجه الوحدات الأخرى."}, {"f": "MMU", "g": "المعالجة", "b": "وحدة الذاكرة الرئيسية: تخزن البيانات والتعليمات، ولها نوعان: ROM وRAM."}, {"f": "ROM", "g": "المعالجة", "b": "ذاكرة القراءة فقط: تحتوي البرامج الأساسية التي يحتاجها الحاسوب عند كل تشغيل، ولا تفقد محتوياتها عند انقطاع التيار الكهربائي، ومنها برنامج الإعداد للحاسب."}, {"f": "RAM", "g": "المعالجة", "b": "الذاكرة العشوائية: يتعامل معها المستخدم في خزن برامجه وبياناته ومعالجتها مباشرة، وتفقد غير المحفوظ عند انقطاع التغذية الكهربائية."}, {"f": "القرص الصلب", "g": "وحدات الخزن", "b": "Hard Disc: يخزن أنظمة التشغيل والبرامج التطبيقية ولغات البرمجة وملفات المستخدم."}, {"f": "القرص المرن", "g": "وحدات الخزن", "b": "Floppy Disc: وسيط تخزين صغير سعته 1.44 ميجا بايت، تم الاستغناء عنه وحلّ محله القرص القابل للإزالة (Flash Memory)."}, {"f": "أقراص الليزر CD-ROM", "g": "وحدات الخزن", "b": "يتم الخزن فيها لمرة واحدة، وسعتها حوالي 700 ميجا بايت."}, {"f": "Flash Memory", "g": "وحدات الخزن", "b": "القرص القابل للإزالة: سعة تخزين عالية وسهولة استخدام، ويمكن الكتابة عليه أكثر من مرة (حذف محتوياته واستبدالها)."}, {"f": "نظام التشغيل OS", "g": "نظام التشغيل", "b": "«الروح» التي تدير جسد الحاسوب: البرنامج الأساسي الذي يربط المكونات المادية بالمستخدم، وبدونه لا يمكن تشغيل أي تطبيق أو لعبة."}, {"f": "Desktop OS", "g": "نظام التشغيل", "b": "أنظمة الحواسيب الشخصية: ويندوز وماك ولينكس."}, {"f": "Mobile OS", "g": "نظام التشغيل", "b": "أنظمة الأجهزة المحمولة: أندرويد وiOS."}, {"f": "Server OS", "g": "نظام التشغيل", "b": "أنظمة الخوادم: مصممة لإدارة الشبكات الكبيرة وتوفير الخدمات، مثل Windows Server ولينكس."}, {"f": "Embedded OS", "g": "نظام التشغيل", "b": "الأنظمة المدمجة: توجد في الأجهزة المنزلية والسيارات والآلات الصناعية."}, {"f": "Windows", "g": "نظام التشغيل", "b": "الأكثر استخداماً عالمياً، المنصة الأولى للألعاب (DirectX)، أكبر مكتبة برامج، سهل الاستخدام؛ لكنه الأكثر عرضة للفيروسات ويستهلك الموارد مع الوقت."}, {"f": "macOS", "g": "نظام التشغيل", "b": "مصمم لأجهزة أبل بتكامل واستقرار، مفضل للمصممين والمحررين، آمن؛ لكنه حصري لأجهزة أبل باهظة الثمن وغير مرن في ترقية القطع."}, {"f": "Linux", "g": "نظام التشغيل", "b": "مفتوح المصدر ومجاني، الأكثر أماناً وخصوصية، خفيف الأداء؛ لكنه يحتاج منحنى تعلم ولا يدعم مباشرة بعض البرامج (Adobe Suite) أو الألعاب الكبرى."}, {"f": "Distros", "g": "نظام التشغيل", "b": "توزيعات لينكس المتعددة: مثل Ubuntu للمبتدئين وKali للمتخصصين."}, {"f": "Ecosystem", "g": "نظام التشغيل", "b": "النظام البيئي لأبل: تجربة متصلة بين أجهزة أبل مثل iPhone وiPad وMac."}, {"f": "Standard User / Administrator", "g": "الحسابات", "b": "مستخدم قياسي مقابل مسؤول. يُفضل حساب مسؤول واحد فقط، والقياسي للاستخدام اليومي للأطفال والضيوف. يُغيَّر النوع من Change account type."}, {"f": "Kiosk Mode", "g": "الحسابات", "b": "خاصية الكشك: تحول الجهاز إلى منصة عرض لا يصل المستخدم فيها إلا إلى تطبيق واحد. تُعد من Assigned access."}, {"f": "Local Account", "g": "الحسابات", "b": "الحساب المحلي: شرط لحذف كلمة المرور، فلا يمكن حذفها مع حساب مايكروسوفت (بريد إلكتروني)."}, {"f": "Task Manager", "g": "سطح المكتب وشريط المهام", "b": "مدير المهام: يراقب أداء المعالج والرام، ويغلق البرامج المعلقة، ويتحكم في برامج بدء التشغيل."}, {"f": "Taskbar", "g": "سطح المكتب وشريط المهام", "b": "شريط المهام: يُضبط من النقر بزر الماوس الأيمن عليه (Toolbars، Search، ترتيب النوافذ، Lock the taskbar، Taskbar settings)."}, {"f": "Auto-hide", "g": "سطح المكتب وشريط المهام", "b": "الإخفاء التلقائي لشريط المهام، من Taskbar settings."}, {"f": "Night light", "g": "سطح المكتب وشريط المهام", "b": "الضوء الليلي: يقلل اللون الأزرق لإراحة العين في المساء (من Display settings)."}, {"f": "Auto arrange icons", "g": "سطح المكتب وشريط المهام", "b": "ترتيب تلقائي: يرتب ويندوز الأيقونات تلقائياً في أعمدة، ولا يمكن تحريك أيقونة لمكان فارغ بحرية."}];
let deck=[],pos=0,known=new Set(),only=false;const box=$('#box');
function build(keep){deck=C.map((_,k)=>k).filter(k=>!only||!known.has(k));if(!keep)pos=0;if(pos>=deck.length)pos=0;draw()}
function stat(){$('#kn').textContent=`عرفتها: ${known.size} / ${C.length}`;$('#bar').style.width=(known.size/C.length*100)+'%';$('#pg').textContent=deck.length?`بطاقة ${pos+1} من ${deck.length}`:'—'}
function draw(){stat();if(!deck.length){box.innerHTML='<div class="card done"><h2>🎉 أنهيت كل البطاقات!</h2><p style="color:var(--mu)">عرفت جميع المصطلحات. أعد البدء للمراجعة من جديد.</p><button class="btn p" id="rs">إعادة البدء</button></div>';$('#rs').onclick=()=>{known.clear();only=false;$('#ov').classList.remove('on');build()};return}
 const c=C[deck[pos]];box.innerHTML=`<div class="scene" id="sc"><div class="flip" id="fl"><div class="face front"><span class="tag">${esc(c.g)}</span><h2>${en(c.f)}</h2><p>اضغط على البطاقة لقلبها</p></div><div class="face back"><div>${en(c.b)}</div></div></div></div>
 <div class="row"><button class="btn" id="pv">→ السابقة</button><button class="btn" id="nx">التالية ←</button></div><div class="row"><button class="btn ok" id="ky">عرفتها ✓</button><button class="btn rv" id="rv">أراجعها ↻</button></div>`;
 $('#sc').onclick=()=>$('#fl').classList.toggle('on');$('#nx').onclick=nx;$('#pv').onclick=pv;$('#ky').onclick=()=>{known.add(deck[pos]);after()};$('#rv').onclick=()=>{known.delete(deck[pos]);after()}}
function nx(){pos=(pos+1)%deck.length;draw()}function pv(){pos=(pos-1+deck.length)%deck.length;draw()}
function after(){if(only){build(true)}else nx()}
$('#sh').onclick=()=>{sh(deck);pos=0;draw()};$('#ov').onclick=function(){only=!only;this.classList.toggle('on',only);build()};$('#rst').onclick=()=>{known.clear();only=false;$('#ov').classList.remove('on');build()};
document.addEventListener('keydown',e=>{if(!deck.length)return;if(e.key===' '||e.key==='Enter'){e.preventDefault();$('#fl').classList.toggle('on')}else if(e.key==='ArrowLeft')nx();else if(e.key==='ArrowRight')pv()});
build();
</script></body></html>
