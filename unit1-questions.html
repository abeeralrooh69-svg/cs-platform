<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بنك الأسئلة: الإدارة والتشغيل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#0a1128;--sf:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--tx:#fff;--mu:#a0aec0;--cy:#00f2fe;--ok:#34d399;--no:#fb7185;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,system-ui,sans-serif;color:var(--tx);line-height:1.75;min-height:100vh;background:radial-gradient(55% 35% at 85% -5%,rgba(79,172,254,.28),transparent 70%),radial-gradient(45% 30% at 0% 15%,rgba(0,242,254,.12),transparent 70%),var(--bg)}
.wrap{max-width:720px;margin:auto;padding:16px 14px 60px}
.top{text-align:center;padding:10px 0 4px}.top h1{font-size:clamp(1.25rem,5vw,1.8rem);font-weight:800;margin:0 0 2px}.top p{margin:0;color:var(--mu);font-size:.9rem}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:.85rem;margin:16px 0 8px;gap:8px;flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4facfe,#00f2fe);transition:width .35s}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:22px;padding:20px;margin-top:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;color:var(--cy);background:rgba(0,242,254,.1);border:1px solid rgba(0,242,254,.25);border-radius:99px;padding:1px 12px}
.en{font-family:system-ui,sans-serif;font-size:.94em;color:#cdeaff;unicode-bidi:isolate}
.btn{font:inherit;font-weight:700;font-size:.92rem;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:9px 18px;cursor:pointer;transition:.2s}
.btn:hover{border-color:var(--cy);color:var(--cy)}.btn.p{background:linear-gradient(135deg,#4facfe,#00f2fe);border-color:transparent;color:#06142e}.btn.p:hover{box-shadow:0 0 22px rgba(0,242,254,.5);color:#06142e}
.btn.ok{background:rgba(52,211,153,.15);border-color:rgba(52,211,153,.5);color:var(--ok)}.btn.rv{background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.45);color:var(--no)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.row .btn{flex:1;min-width:110px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.qt{font-size:1.12rem;font-weight:700;margin:12px 0 14px;line-height:1.8}
.opt{display:block;width:100%;text-align:start;font:inherit;color:var(--tx);background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin:9px 0;cursor:pointer;transition:.2s}
.opt:hover:not(:disabled){border-color:var(--cy);background:rgba(0,242,254,.07)}.opt:disabled{cursor:default}
.opt.ok{background:rgba(52,211,153,.16);border-color:var(--ok);color:#b9f6dc}.opt.no{background:rgba(251,113,133,.15);border-color:var(--no);color:#ffd0d7}
.exp{margin:14px 0;padding:12px 16px;border-radius:14px;font-size:.95rem}.exp.g{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.35)}.exp.b{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.35)}
.res{text-align:center}.ring{--p:0;width:150px;height:150px;border-radius:50%;margin:10px auto 16px;display:grid;place-items:center;background:conic-gradient(#00f2fe calc(var(--p)*1%),rgba(255,255,255,.1) 0)}
.ring b{width:122px;height:122px;border-radius:50%;background:#0d1836;display:grid;place-items:center;font-size:2.1rem}
.rev{text-align:start;margin-top:16px}.rev .it{border-top:1px solid var(--bd);padding:12px 0}.rev small{color:var(--mu)}.rev .a{color:var(--ok)}
</style></head><body><div class="wrap"><div class="top"><h1>بنك الأسئلة: الإدارة والتشغيل</h1><p>أسئلة اختيار من متعدد وصح/خطأ مع تغذية راجعة فورية</p></div><div class="meta"><span id="pg"></span><span id="sc"></span></div><div class="bar"><i id="bar"></i></div><div id="box"></div></div><script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RE=/([A-Za-z0-9][A-Za-z0-9 +&'’.,:\/_\-]*[A-Za-z0-9]|[A-Za-z])/g;
const en=s=>String(s).split(RE).map((p,i)=>i%2?`<bdi dir="ltr" class="en">${esc(p)}</bdi>`:esc(p)).join('');
const sh=a=>{for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const Q=[{"t": "mc", "q": "أي مما يلي ليس من العناصر الثلاثة الأساسية للحاسوب؟", "o": ["المكونات المادية", "المكونات البرمجية", "مستخدم الحاسوب", "شبكة الإنترنت"], "a": 3, "e": "العناصر الثلاثة هي: المكونات المادية (Hardware) والمكونات البرمجية (Software) ومستخدم الحاسوب (User)."}, {"t": "mc", "q": "الحاسب الذي يُستخدم لغرض واحد فقط صُمم من أجله يسمى حاسب:", "o": ["الأغراض العامة", "الأغراض الخاصة", "تناظري", "مكتبي"], "a": 1, "e": "حاسبات الأغراض الخاصة (Special Purpose) تُستخدم لغرض واحد مثل التحكم في العمليات وأجهزة الإنذار."}, {"t": "mc", "q": "أنظمة البنوك وحسابات الرواتب والميزانيات تُنفَّذ على حاسبات:", "o": ["الأغراض الخاصة", "الأغراض العامة", "الهجينة", "التناظرية"], "a": 1, "e": "حاسبات الأغراض العامة (General Purpose) تُستخدم علمياً وتجارياً وإدارياً ومنها أنظمة البنوك والرواتب."}, {"t": "mc", "q": "الحاسبات التي تعالج بيانات تتغير باستمرار مثل درجات الحرارة والضغط الجوي هي:", "o": ["الرقمية", "الهجينة", "التناظرية", "المكتبية"], "a": 2, "e": "الحاسبات التناظرية (Analog) تعالج البيانات المتغيرة باستمرار."}, {"t": "mc", "q": "الحاسبات التي تجمع بين مزايا الرقمي والتناظري تسمى:", "o": ["Analog", "Digital", "Hybrid", "Mini"], "a": 2, "e": "الهجينة (Hybrid): مداخل ومخارج تناظرية ومعالجة رقمية."}, {"t": "mc", "q": "الحاسب الشخصي (PC) يعتمد على:", "o": ["المعالج الدقيق", "الأقراص المرنة", "الأنظمة المدمجة", "المعالجة التناظرية"], "a": 0, "e": "الحاسبات الدقيقة (Microcomputers) تعتمد على المعالج الدقيق (Microprocessor) وأُطلق عليها الحاسب الشخصي."}, {"t": "mc", "q": "الأجهزة الطرفية (Peripheral Devices) هي المكونات التي:", "o": ["توضع داخل صندوق النظام فقط", "ترتبط خارجياً عبر المنافذ (Ports)", "تخزن البيانات داخل المعالج", "لا يمكن فصلها أبداً"], "a": 1, "e": "الأجهزة الطرفية ترتبط خارجياً بالمنافذ الموجودة خلف صندوق النظام."}, {"t": "mc", "q": "أي مما يلي من وحدات الإدخال؟", "o": ["الطابعة", "الشاشة", "لوحة المفاتيح", "السماعة"], "a": 2, "e": "وحدات الإدخال: الكاميرا والميكروفون والماسح الضوئي ولوحة المفاتيح والفأرة."}, {"t": "mc", "q": "أي مما يلي من وحدات الإخراج؟", "o": ["الفأرة", "الطابعة", "الماسح الضوئي", "الميكروفون"], "a": 1, "e": "وحدات الإخراج: الطابعة والسماعة والشاشة."}, {"t": "mc", "q": "أكثر أجزاء الحاسوب أهمية لأنها تعالج البيانات وتنسق العمل بين الأجزاء هي:", "o": ["القرص الصلب", "الشاشة", "وحدة المعالجة المركزية CPU", "لوحة المفاتيح"], "a": 2, "e": "الـ CPU هي الأهم لأنها تقوم بمعالجة البيانات وتنسيق العمل بين أجزاء الحاسوب."}, {"t": "mc", "q": "الوحدة المسؤولة عن الجمع والطرح والقسمة والمقارنة بين عددين هي:", "o": ["Control Unit", "ALU", "ROM", "RAM"], "a": 1, "e": "وحدة الحساب والمنطق (ALU) تقوم بالعمليات الحسابية والمنطقية."}, {"t": "mc", "q": "الوحدة التي تراقب تنفيذ الأعمال وتوجه الوحدات الأخرى هي:", "o": ["وحدة التحكم", "وحدة الحساب والمنطق", "القرص الصلب", "الذاكرة العشوائية"], "a": 0, "e": "وحدة التحكم (Control Unit) تراقب وتوجه الوحدات المكونة للحاسوب."}, {"t": "mc", "q": "الذاكرة التي لا تفقد محتوياتها عند انقطاع التيار الكهربائي هي:", "o": ["RAM", "ROM", "الذاكرة غير المحفوظة", "ذاكرة العمل"], "a": 1, "e": "ROM تحتوي البرامج الأساسية ولا تفقدها عند انقطاع التيار."}, {"t": "mc", "q": "إذا لم تحفظ برامجك وبياناتك وانقطعت الكهرباء، فإنك تفقدها من:", "o": ["ROM", "القرص الصلب", "RAM", "Flash Memory"], "a": 2, "e": "الذاكرة العشوائية (RAM) تفقد البيانات غير المحفوظة عند انقطاع التغذية الكهربائية."}, {"t": "mc", "q": "برنامج الإعداد للحاسب (Setup) يُخزَّن في:", "o": ["ROM", "RAM", "القرص المرن", "CD-ROM"], "a": 0, "e": "من البرامج المخزنة في ذاكرة القراءة فقط ROM برنامج الإعداد للحاسب."}, {"t": "mc", "q": "سعة القرص المرن (Floppy Disc) تساوي:", "o": ["700 ميجا بايت", "1.44 ميجا بايت", "4.7 جيجا بايت", "1 تيرا بايت"], "a": 1, "e": "القرص المرن سعته 1.44 ميجا بايت وتم الاستغناء عنه."}, {"t": "mc", "q": "سعة قرص الليزر CD-ROM تقريباً:", "o": ["1.44 ميجا بايت", "700 ميجا بايت", "32 جيجا بايت", "500 جيجا بايت"], "a": 1, "e": "سعة CD-ROM حوالي 700 ميجا بايت ويتم الخزن فيه لمرة واحدة."}, {"t": "mc", "q": "الوسيط الذي يخزن أنظمة التشغيل والبرامج التطبيقية ولغات البرمجة هو:", "o": ["القرص الصلب", "القرص المرن", "CD-ROM", "ROM"], "a": 0, "e": "القرص الصلب (Hard Disc) يخزن أنظمة التشغيل والبرامج والملفات."}, {"t": "mc", "q": "وُصف نظام التشغيل بأنه:", "o": ["الجسد الذي يحمل الحاسوب", "الروح التي تدير جسد الحاسوب", "أداة للطباعة فقط", "وحدة إخراج"], "a": 1, "e": "نظام التشغيل هو البرنامج الأساسي الذي يربط المكونات المادية بالمستخدم."}, {"t": "mc", "q": "Windows Server من أنظمة:", "o": ["الحواسيب الشخصية", "الأجهزة المحمولة", "الخوادم", "المدمجة"], "a": 2, "e": "أنظمة الخوادم (Server OS) مصممة لإدارة الشبكات الكبيرة وتوفير الخدمات."}, {"t": "mc", "q": "أندرويد وiOS من أنظمة:", "o": ["الأجهزة المحمولة", "الخوادم", "الأنظمة المدمجة", "الحواسيب المكتبية فقط"], "a": 0, "e": "أنظمة الأجهزة المحمولة (Mobile OS)."}, {"t": "mc", "q": "النظام الأول والأفضل للألعاب بفضل دعم DirectX هو:", "o": ["Linux", "macOS", "Windows", "iOS"], "a": 2, "e": "ويندوز المنصة الأولى للألعاب الإلكترونية بفضل DirectX."}, {"t": "mc", "q": "النظام الحصري لأجهزة أبل ومن عيوبه ارتفاع الثمن وصعوبة ترقية القطع هو:", "o": ["Windows", "Linux", "Android", "macOS"], "a": 3, "e": "macOS مصمم خصيصاً لأجهزة أبل ولا يعمل على غيرها."}, {"t": "mc", "q": "النظام المجاني مفتوح المصدر الذي يُعد الأكثر أماناً هو:", "o": ["Linux", "Windows", "macOS", "iOS"], "a": 0, "e": "لينكس مفتوح المصدر ومجاني وخيار أول لخبراء الأمن السيبراني."}, {"t": "mc", "q": "Ubuntu وKali أمثلة على:", "o": ["توزيعات لينكس (Distros)", "أنظمة أبل", "أقراص التخزين", "برامج التطبيق"], "a": 0, "e": "Ubuntu للمبتدئين وKali للمتخصصين، وكلاهما من توزيعات لينكس."}, {"t": "mc", "q": "لمنح مستخدم صلاحيات المسؤول نستخدم زر:", "o": ["Change account type", "Sign out", "Add a language", "Set up a kiosk"], "a": 0, "e": "من Settings ثم Accounts ثم Family & other users ثم Change account type."}, {"t": "mc", "q": "الخاصية التي تقيد المستخدم بتطبيق واحد وتحول الجهاز إلى منصة عرض هي:", "o": ["Kiosk Mode", "Night light", "Auto-hide", "Task View"], "a": 0, "e": "خاصية الكشك (Kiosk Mode) تُعد من Assigned access."}, {"t": "mc", "q": "لا يمكن حذف كلمة المرور إذا كان الحساب:", "o": ["محلياً (Local Account)", "حساب مايكروسوفت (بريد إلكتروني)", "قياسياً", "مسؤولاً"], "a": 1, "e": "يجب أن يكون الحساب محلياً حتى يمكن حذف كلمة المرور."}, {"t": "mc", "q": "أي مما يلي من مهام مدير المهام (Task Manager)؟", "o": ["مراقبة أداء المعالج والرام", "تغيير خلفية سطح المكتب", "طباعة الملفات", "تحويل الصور"], "a": 0, "e": "مدير المهام يراقب الأداء ويغلق البرامج المعلقة ويتحكم في برامج بدء التشغيل."}, {"t": "mc", "q": "خيار Lock the taskbar يؤدي إلى:", "o": ["حذف شريط المهام", "منع تغيير حجم الشريط أو سحبه", "إخفاء الأيقونات", "إغلاق جميع النوافذ"], "a": 1, "e": "تأمين شريط المهام يمنع تغيير حجمه أو سحبه، ويُفضل تفعيله لتجنب تغيير الواجهة بالخطأ."}, {"t": "mc", "q": "ميزة الضوء الليلي (Night light) تفيد في:", "o": ["تكبير النصوص", "تقليل اللون الأزرق وإراحة العين", "زيادة دقة الشاشة", "تدوير الشاشة"], "a": 1, "e": "الضوء الليلي يقلل اللون الأزرق وإراحة العين في المساء."}, {"t": "mc", "q": "خيار Sort by في سطح المكتب يُستخدم لـ:", "o": ["ترتيب الأيقونات والملفات وفق نظام معين", "تغيير لغة الجهاز", "إنشاء مستخدم جديد", "إغلاق البرامج"], "a": 0, "e": "الفرز حسب: الاسم أو الحجم أو نوع العنصر أو تاريخ التعديل."}, {"t": "tf", "q": "القرص المرن ما زال الوسيط الأكثر استخداماً اليوم.", "o": ["صح", "خطأ"], "a": 1, "e": "تم الاستغناء عن القرص المرن وحلّ محله القرص القابل للإزالة (Flash Memory)."}, {"t": "tf", "q": "تستعمل الحاسبات الرقمية المعلومات المتقطعة والمتغيرات الممثلة بالأعداد.", "o": ["صح", "خطأ"], "a": 0, "e": "هذه هي طريقة عمل الحاسبات الرقمية (Digital)."}, {"t": "tf", "q": "ذاكرة ROM هي التي يخزن فيها المستخدم برامجه وبياناته بحرية أثناء العمل.", "o": ["صح", "خطأ"], "a": 1, "e": "هذه وظيفة الذاكرة العشوائية RAM؛ أما ROM فتحتوي البرامج الأساسية للحاسوب."}, {"t": "tf", "q": "يُفضل أن يكون لديك حساب مسؤول واحد فقط، وحساب قياسي للاستخدام اليومي.", "o": ["صح", "خطأ"], "a": 0, "e": "لحماية النظام من أي تغييرات غير مقصودة."}, {"t": "tf", "q": "يدعم لينكس برامج Adobe Suite مباشرة دون أي مشاكل.", "o": ["صح", "خطأ"], "a": 1, "e": "لينكس لا يدعم مباشرة بعض البرامج الشهيرة مثل Adobe Suite."}, {"t": "tf", "q": "إلغاء تحديد Show desktop icons يحذف الأيقونات نهائياً من الجهاز.", "o": ["صح", "خطأ"], "a": 1, "e": "الأيقونات تختفي من سطح المكتب لكنها لا تُحذف."}, {"t": "tf", "q": "الحاسبات الهجينة تجمع بين الرقمي والتناظري.", "o": ["صح", "خطأ"], "a": 0, "e": "تأخذ الدقة والتخزين من الرقمي وسرعة الاستجابة من التناظري."}, {"t": "tf", "q": "عند إنشاء مستخدم جديد قد لا يظهر في قائمة الدخول إلا بعد تسجيل الخروج أو إعادة التشغيل.", "o": ["صح", "خطأ"], "a": 0, "e": "هذه ملاحظة مهمة عند تفعيل الحساب الجديد."}];
let order=[],i=0,score=0,wrong=[];const box=$('#box');
function start(){order=sh(Q.map((_,k)=>k));i=0;score=0;wrong=[];draw()}
function draw(){if(i>=order.length)return fin();const q=Q[order[i]];let o=q.o.map((x,k)=>({x,k}));if(q.t==='mc')sh(o);
 $('#bar').style.width=(i/order.length*100)+'%';$('#pg').textContent=`سؤال ${i+1} من ${order.length}`;$('#sc').textContent=`الدرجة: ${score}`;
 box.innerHTML=`<div class="card"><span class="tag">${q.t==='tf'?'صح أو خطأ':'اختيار من متعدد'}</span><div class="qt">${en(q.q)}</div>${o.map(x=>`<button class="opt" data-k="${x.k}">${en(x.x)}</button>`).join('')}<div id="fb"></div></div>`;
 box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b,q))}
function pick(b,q){const ok=+b.dataset.k===q.a;box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add('ok')});
 if(ok)score++;else{b.classList.add('no');wrong.push(q)}$('#sc').textContent=`الدرجة: ${score}`;
 $('#fb').innerHTML=`<div class="exp ${ok?'g':'b'}"><b>${ok?'✅ إجابة صحيحة':'❌ إجابة خاطئة'}</b><div>${en(q.e)}</div></div><button class="btn p" style="width:100%" id="nx">${i+1>=order.length?'عرض النتيجة':'السؤال التالي ←'}</button>`;
 $('#nx').onclick=()=>{i++;draw();scrollTo(0,0)}}
function fin(){const n=order.length,p=Math.round(score/n*100);$('#bar').style.width='100%';$('#pg').textContent='انتهى الاختبار';
 const m=p>=90?'ممتاز! إتقان رائع للوحدة 🌟':p>=75?'جيد جداً، استمر 👏':p>=50?'جيد، راجع الأخطاء وأعد المحاولة 💪':'تحتاج إلى مراجعة الدرس ثم أعد المحاولة 📘';
 box.innerHTML=`<div class="card res"><span class="tag">النتيجة النهائية</span><div class="ring" style="--p:${p}"><b>${p}%</b></div><h2 style="margin:0 0 4px">${score} من ${n}</h2><p style="color:var(--mu);margin:0 0 14px">${m}</p><div class="row"><button class="btn p" id="again">إعادة الاختبار</button>${wrong.length?'<button class="btn" id="rvw">مراجعة الأخطاء ('+wrong.length+')</button>':''}</div><div id="rvbox"></div></div>`;
 $('#again').onclick=()=>{start();scrollTo(0,0)};const r=$('#rvw');if(r)r.onclick=()=>{$('#rvbox').innerHTML='<div class="rev">'+wrong.map(q=>`<div class="it"><b>${en(q.q)}</b><br><span class="a">الصحيح: ${en(q.o[q.a])}</span><br><small>${en(q.e)}</small></div>`).join('')+'</div>';r.style.display='none'}}
