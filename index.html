<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية المعراج الرقمي | Al-Me'raj Digital Academy</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>

    <!-- الشريط العلوي -->
    <header class="navbar">
        <div class="container nav-in">
            <a href="#home" class="logo-brand">
                <img src="logo.png" alt="Logo" class="nav-logo">
                <div class="brand-text">
                    <span class="brand-title">أكاديمية المعراج الرقمي</span>
                    <span class="brand-subtitle">Al-Me'raj Digital Academy</span>
                </div>
            </a>
            <nav class="nav-links">
                <button class="nav-btn active" onclick="switchTab('home')">الرئيسية</button>
                <button class="nav-btn" onclick="switchTab('courses')">الكورسات</button>
                <button class="nav-btn admin-badge" onclick="switchTab('admin')">⚙️ لوحة الإدارة</button>
            </nav>
        </div>
    </header>

    <!-- الواجهة الرئيسية للطلاب -->
    <main id="main-content" class="container">
        <!-- قسم العرض العام -->
        <section id="tab-home" class="tab-content active">
            <div class="hero-section">
                <h1>مرحباً بك في <span>أكاديمية المعراج الرقمي</span></h1>
                <p>المنصة التعليمية المتكاملة لعلوم الحاسوب وإدارة الأنظمة.</p>
            </div>
            <div id="courses-list" class="courses-grid">
                <!-- يتم تحميل الكورسات والدروس والوسائل هنا ديناميكياً -->
            </div>
        </section>

        <!-- قسم لوحة الإدارة (Admin Dashboard) -->
        <section id="tab-admin" class="tab-content">
            <div class="admin-header">
                <h2>إدارة المحتوى والدروس</h2>
                <p>إضافة الكورسات، الوحدات، والدروس مع الوسائل التعليمية الست.</p>
            </div>

            <!-- نموذج إضافة درس جديد -->
            <form id="add-lesson-form" class="admin-form glass-card">
                <h3>إضافة درس جديد وتحديد الوسائل</h3>

                <div class="form-group">
                    <label>اسم الكورس:</label>
                    <input type="text" id="course-name" placeholder="مثال: كورس الأساسيات" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>اسم الوحدة:</label>
                        <input type="text" id="unit-name" placeholder="مثال: الوحدة الأولى - الإدارة وتشغيل الحاسوب" required>
                    </div>
                    <div class="form-group">
                        <label>عنوان الدرس:</label>
                        <input type="text" id="lesson-title" placeholder="مثال: الدرس الأول - مقدمة في المكونات" required>
                    </div>
                </div>

                <hr class="divider">
                <h4>إرفاق الوسائل التعليمية الست للدرس:</h4>

                <!-- الوسيلة 1: PDF -->
                <div class="media-input-group">
                    <label>1. محتوى الشرح (PDF):</label>
                    <div class="input-options">
                        <input type="text" id="pdf-url" placeholder="إلصاق رابط ملف PDF">
                        <input type="file" id="pdf-file" accept=".pdf">
                    </div>
                </div>

                <!-- الوسيلة 2: فيديو -->
                <div class="media-input-group">
                    <label>2. فيديو الدرس:</label>
                    <div class="input-options">
                        <input type="text" id="video-url" placeholder="إلصاق رابط فيديو (YouTube / Drive)">
                        <input type="file" id="video-file" accept="video/*">
                    </div>
                </div>

                <!-- الوسيلة 3: خرائط ذهنية -->
                <div class="media-input-group">
                    <label>3. الخرائط الذهنية (Mind Map):</label>
                    <div class="input-options">
                        <input type="text" id="mindmap-url" placeholder="إلصاق رابط الصورة أو المستند">
                        <input type="file" id="mindmap-file" accept="image/*,.pdf">
                    </div>
                </div>

                <!-- الوسيلة 4: بطاقات المصطلحات -->
                <div class="media-input-group">
                    <label>4. بطاقات المصطلحات (Terms / Flashcards):</label>
                    <div class="input-options">
                        <input type="text" id="terms-url" placeholder="إلصاق رابط البطاقات أو الملف">
                        <input type="file" id="terms-file" accept=".json,.pdf,image/*">
                    </div>
                </div>

                <!-- الوسيلة 5: بنك الأسئلة -->
                <div class="media-input-group">
                    <label>5. بنك الأسئلة:</label>
                    <div class="input-options">
                        <input type="text" id="questions-url" placeholder="إلصاق رابط بنك الأسئلة">
                        <input type="file" id="questions-file" accept=".pdf,.doc,.docx">
                    </div>
                </div>

                <!-- الوسيلة 6: الاختبار التفاعلي -->
                <div class="media-input-group">
                    <label>6. الاختبار التفاعلي (Quiz):</label>
                    <div class="input-options">
                        <input type="text" id="quiz-url" placeholder="إلصاق رابط نموذج الاختبار (Google Forms / رابط مباشر)">
                        <input type="file" id="quiz-file" accept=".json,.html">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-submit">حفظ ونشر الدرس</button>
            </form>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
