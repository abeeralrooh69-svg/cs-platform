<!-- قسم لوحة الإدارة -->
<section id="admin-panel" class="admin-section" style="padding: 20px; color: #fff;">
    <h2>لوحة إدارة الكورسات والدروس</h2>

    <!-- إضافة كورس -->
    <div class="admin-box" style="margin-bottom: 25px; border: 1px solid #333; padding: 15px; border-radius: 8px;">
        <h3>1. إضافة كورس جديد</h3>
        <input type="text" id="courseTitle" placeholder="عنوان الكورس" required style="width: 100%; margin-bottom: 10px; padding: 8px;">
        <textarea id="courseDesc" placeholder="وصف الكورس" style="width: 100%; margin-bottom: 10px; padding: 8px;"></textarea>
        <button onclick="submitNewCourse()" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">إضافة الكورس</button>
    </div>

    <!-- إضافة درس ووسائطه الستة -->
    <div class="admin-box" style="border: 1px solid #333; padding: 15px; border-radius: 8px;">
        <h3>2. إضافة درس بالوسائل التعليمية الستة</h3>
        <select id="selectCourse" style="width: 100%; margin-bottom: 10px; padding: 8px;"></select>
        <select id="selectUnit" style="width: 100%; margin-bottom: 10px; padding: 8px;"></select>

        <input type="text" id="lessonTitle" placeholder="عنوان الدرس" style="width: 100%; margin-bottom: 10px; padding: 8px;">

        <h4>إرفاق الوسائل التعليمية (ملف أو رابط):</h4>
        
        <label>1. ملف PDF / الملخص:</label>
        <input type="file" id="resPdfFile" accept=".pdf">
        <input type="url" id="resPdfUrl" placeholder="أو ضع رابط المستند هنا" style="width: 100%; margin-bottom: 10px;">

        <label>2. الفيديو التعليمي:</label>
        <input type="file" id="resVideoFile" accept="video/*">
        <input type="url" id="resVideoUrl" placeholder="أو ضع رابط الفيديو (YouTube/Drive)" style="width: 100%; margin-bottom: 10px;">

        <label>3. العرض التقديمي (PPTX/PDF):</label>
        <input type="file" id="resPptFile">
        <input type="url" id="resPptUrl" placeholder="أو ضع رابط العرض التقديمي" style="width: 100%; margin-bottom: 10px;">

        <label>4. ورقة العمل / التمارين:</label>
        <input type="file" id="resWorksheetFile">
        <input type="url" id="resWorksheetUrl" placeholder="أو ضع رابط التمارين" style="width: 100%; margin-bottom: 10px;">

        <label>5. الخريطة الذهنية:</label>
        <input type="file" id="resMindmapFile">
        <input type="url" id="resMindmapUrl" placeholder="أو ضع رابط الخريطة الذهنية" style="width: 100%; margin-bottom: 10px;">

        <label>6. البطاقات التعليمية (Flashcards):</label>
        <input type="file" id="resFlashcardsFile">
        <input type="url" id="resFlashcardsUrl" placeholder="أو ضع رابط البطاقات" style="width: 100%; margin-bottom: 10px;">

        <button onclick="submitNewLesson()" style="padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px;">حفظ الدرس بالوسائل</button>
    </div>
</section>
