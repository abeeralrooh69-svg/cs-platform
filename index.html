<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة الحاسب التعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<header class="sticky z-30 border-b" style="top:env(safe-area-inset-top,0px);background:var(--sf);border-color:var(--bd)">
<div class="max-w-5xl mx-auto flex items-center gap-3 px-4 py-3">
<a href="#/" class="flex items-center gap-2 font-extrabold text-lg flex-1 ac"><i data-lucide="cpu"></i>منصة الحاسب التعليمية</a>
<button class="btn" data-act="theme" aria-label="الوضع"><i data-lucide="moon"></i></button>
<button class="btn hidden" id="inst" data-act="install"><i data-lucide="download"></i><span class="hidden sm:inline">تثبيت</span></button><a class="btn hidden" id="adm" href="#/admin"><i data-lucide="settings"></i><span class="hidden sm:inline">الإدارة</span></a><button class="btn hidden" id="lo" data-act="logout"><i data-lucide="log-out"></i><span class="hidden sm:inline">خروج</span></button>
</div></header>
<main id="main" class="max-w-5xl mx-auto px-4 py-6"></main>
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/60 p-3 sm:p-8"><div class="card h-full flex flex-col overflow-hidden"><div class="flex items-center gap-2 p-3 border-b" style="border-color:var(--bd)"><b id="mt" class="flex-1"></b><a id="mo" target="_blank" rel="noopener" class="btn p"><i data-lucide="external-link"></i>فتح في تبويب جديد</a><button class="btn" data-act="close"><i data-lucide="x"></i></button></div><iframe id="mf" class="flex-1 w-full bg-white"></iframe></div></div>
<div id="tc"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
